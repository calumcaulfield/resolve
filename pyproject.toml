[project]
name = "resolve"
version = "1.0.0"
description = "Autonomous order-operations agent for e-commerce: triage, ground, act, verify — with human approval gates and full cost/quality telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Calum Caulfield" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.57"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
resolve = "resolve.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N806"]
"evals/*" = ["S"]
# The dataset generator uses `random.Random(seed)` deliberately: the point is
# reproducibility, not unpredictability. Nothing here is a secret.
"src/resolve/seed/*" = ["S311"]
# The retry jitter is likewise not cryptographic.
"src/resolve/workflow/engine.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []
mypy_path = "src"
packages = ["resolve"]

[[tool.mypy.overrides]]
module = ["redis.*", "anthropic.*", "openai.*", "prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
